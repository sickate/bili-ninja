<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bili Ninja · 媒体提取</title>
  <link rel="stylesheet" href="audio.css">
  <script type="module" src="audio.js"></script>
</head>
<body>
  <main>
    <header><span class="logo" aria-hidden="true">♫</span><span>Bili Ninja</span><span class="format" id="format">M4A</span></header>
    <h1 id="headline">把声音留下来。</h1>
    <p class="intro" id="intro">提取视频音轨，合并成一个音频文件。</p>
    <fieldset class="mode" id="mode" disabled>
      <legend class="sr-only">导出内容</legend>
      <label><input type="radio" name="mode" value="audio" checked>仅音频</label>
      <label><input type="radio" name="mode" value="video">完整视频</label>
    </fieldset>
    <section aria-labelledby="title">
      <h2 id="title">正在读取视频…</h2>
      <div id="selection" hidden><span id="summary"></span><button id="toggle" type="button">全选</button></div>
      <div id="parts"></div>
      <div id="video-options" hidden>
        <label for="quality">清晰度</label><select id="quality" aria-label="视频清晰度" disabled></select>
        <button type="button" id="refresh-quality">刷新</button>
        <p>每次导出一个完整分 P，包含画面和声音。</p>
      </div>
    </section>
    <div class="actions"><button id="export" type="button" disabled>导出音频</button><button id="cancel" type="button" hidden>取消</button></div>
    <progress id="progress" max="100" value="0" hidden aria-label="提取进度"></progress>
    <p id="status" role="status" aria-live="polite">请保持视频页和侧边栏打开。</p>
    <a id="save" hidden>再次保存音频</a>
    <audio id="preview" controls hidden></audio>
    <video id="video-preview" controls playsinline hidden></video>
    <footer>原始音画 · 本机处理 · 无需额外安装</footer>
  </main>
</body>
</html>
