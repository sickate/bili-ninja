<section class="wrap product-share" id="share" aria-labelledby="share-heading" data-product-share>

    <button type="button" data-share-channel="xiaohongshu" aria-controls="share-editor" aria-expanded="false">小红书</button>
    <button type="button" data-share-channel="weibo" aria-controls="share-editor" aria-expanded="false">微博</button>

  </div>

    <textarea id="share-text" rows="4" data-share-text aria-describedby="share-help"></textarea>

    <input id="share-url" type="url" data-share-url readonly>
    <div class="share-actions">
      <button type="button" data-share-copy="body">复制文案与链接</button>
      <button type="button" data-share-copy="url">复制链接</button>
