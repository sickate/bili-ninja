# Bootstrap only: obtain the www certificate through its dedicated webroot.
# Replace this vhost with instap.nginx.conf after certificate issuance.
server {
    listen 80;
    server_name www.instap.net;
    root /var/www/instap.net/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/instap.net/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
