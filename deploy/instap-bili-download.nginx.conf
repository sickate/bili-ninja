# Include ONLY inside the canonical www.instap.net HTTPS server block.
# API paths carry capabilities: do not enable access/error request-path logging.
location ^~ /api/bili-download/ {
    proxy_pass http://127.0.0.1:9014;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Overwrite client-supplied forwarding headers; backend trusts this header only
    # from its loopback peer. Never use $proxy_add_x_forwarded_for here.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    client_max_body_size 4k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 130s;
    proxy_send_timeout 10s;
    send_timeout 15s;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_hide_header Server;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    error_log /dev/null crit;
}
