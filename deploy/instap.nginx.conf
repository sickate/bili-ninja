# Instap's www site only. Keep other domains in their existing vhosts.
server {
    listen 80;
    server_name www.instap.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/instap.net/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://www.instap.net$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.instap.net;
    root /var/www/instap.net/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.instap.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.instap.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location ~ \.html$ { expires -1; }
    location = /release.json { expires -1; }
    location = /downloads/bili-ninja/release.json { expires -1; }
    location ~ ^/downloads/bili-ninja/bili-ninja-[0-9.]+\.zip$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition attachment;
        try_files $uri =404;
    }
}
