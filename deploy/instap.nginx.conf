# Instap's www site only. Keep other domains in their existing vhosts.
# sites-enabled is included inside nginx's http context. These definitions use
# Instap-specific names; they do not change logging for any other vhost.
# Reject ambiguous duplicate attribution keys, including differently cased keys.
map $args $instap_utm_ambiguous {
    default 0;
    ~*(^|&)utm_source(=[^&]*)?(&[^&]*)*&utm_source(=|&|$) 1;
    ~*(^|&)utm_medium(=[^&]*)?(&[^&]*)*&utm_medium(=|&|$) 1;
    ~*(^|&)utm_campaign(=[^&]*)?(&[^&]*)*&utm_campaign(=|&|$) 1;
    ~*(^|&)utm_content(=[^&]*)?(&[^&]*)*&utm_content(=|&|$) 1;
}
map "$instap_utm_ambiguous:$arg_utm_source" $instap_download_source {
    default "";
    "~^0:(?<instap_source_value>[A-Za-z0-9._~-]{1,80})$" $instap_source_value;
}
map "$instap_utm_ambiguous:$arg_utm_medium" $instap_download_medium {
    default "";
    "~^0:(?<instap_medium_value>[A-Za-z0-9._~-]{1,80})$" $instap_medium_value;
}
map "$instap_utm_ambiguous:$arg_utm_campaign" $instap_download_campaign {
    default "";
    "~^0:(?<instap_campaign_value>[A-Za-z0-9._~-]{1,80})$" $instap_campaign_value;
}
map "$instap_utm_ambiguous:$arg_utm_content" $instap_download_content {
    default "";
    "~^0:(?<instap_content_value>[A-Za-z0-9._~-]{1,80})$" $instap_content_value;
}
log_format instap_download_json escape=json
    '{"time":"$time_iso8601","path":"$uri","status":$status,'
    '"method":"$request_method","bytes":$body_bytes_sent,'
    '"source":"$instap_download_source","medium":"$instap_download_medium",'
    '"campaign":"$instap_download_campaign","content":"$instap_download_content"}';

server {
    listen 80;
    server_name www.instap.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/instap.net/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://www.instap.net$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.instap.net;
    root /var/www/instap.net/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.instap.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.instap.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location ~ \.html$ { expires -1; }
    location = /release.json { expires -1; }
    location = /downloads/bili-ninja/release.json { expires -1; }
    # Publish this one allowlisted aggregate only. Never alias the log directory
    # or the whole state directory into the site; releases do not own this file.
    location = /bili-ninja/stats/summary.json {
        alias /var/lib/instap-downloads/public/summary.json;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location ~ ^/downloads/bili-ninja/bili-ninja-[0-9]+(?:\.[0-9]+)*\.zip$ {
        # Overrides the inherited combined access log for this location only.
        # This directory is deliberately outside /var/log/nginx/*.log and www.
        access_log /var/log/instap-downloads/downloads.jsonl instap_download_json;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition attachment;
        try_files $uri =404;
    }
}
